[package]
name = "native_pubsub_connector"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow = { version = "51.0.0", features = ["ffi", "json"] }
arrow-schema = { version = "51.0.0", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "gzip", "tls", "tls-webpki-roots"] }
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.13", features = ["serde"] }
jni = "0.19"
dashmap = "5.5"
robusta_jni = "0.2"
# openssl = "0.10"
futures = "0.3"
google-cloud-googleapis = { version = "0.16", default-features = false, features = ["pubsub"] }
google-cloud-auth = { version = "0.17", default-features = false }
google-cloud-metadata = { version = "0.5", default-features = false }
google-cloud-token = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
log = "0.4"
env_logger = "0.11"
tokio-stream = "0.1"
# Pin home crate to avoid edition 2024 issue
home = "=0.5.9"
rand = "0.8"
apache-avro = "0.16"
google-cloud-pubsub = { version = "0.30.0", default-features = false, features = ["default"] } 
base64 = "0.22"
jemallocator = { version = "0.5", features = ["disable_initial_exec_tls"] }
