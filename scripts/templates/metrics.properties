# ==============================================================================
# Spark Metrics Configuration for Google Cloud Monitoring (Stackdriver)
# ==============================================================================
# This configuration enables the export of Spark metrics to Cloud Monitoring.
# To use this:
# 1. Upload this file to your cluster (or GCS).
# 2. Reference it in your Dataproc job submission:
#    --files=gs://<bucket>/metrics.properties
#    --properties=spark.metrics.conf=metrics.properties

# Enable Stackdriver Sink for all instances (Driver, Executor)
*.sink.stackdriver.class=com.google.cloud.spark.bigquery.metrics.SparkBigQueryConnectorMetricsSource
# Note: The above class is often available if the BigQuery connector is present. 
# Alternatively, for pure Dataproc native metrics, Dataproc enables some by default.
# But for custom Spark Streaming metrics, we often use the JmxSink or the StatsdSink 
# plugged into the Cloud Logging agent.

# For standard Dataproc 2.x, the recommended approach is usually JMX + Agent or 
# the built-in Dataproc Monitoring (which scrapes specific endpoints).
# However, explicit Stackdriver configuration in Spark is:

# Enable Stackdriver Sink -> DISABLED (Missing JAR)
# *.sink.stackdriver.class=org.apache.spark.metrics.sink.StackdriverSink
# *.sink.stackdriver.period=10
# *.sink.stackdriver.unit=seconds
# *.sink.stackdriver.projectId=pakunuru-1119-20250930202256

# Enable JMX Sink (useful for local debugging or agent scraping)
*.sink.jmx.class=org.apache.spark.metrics.sink.JmxSink

# Enable specific sources
master.source.jvm.class=org.apache.spark.metrics.source.JvmSource
worker.source.jvm.class=org.apache.spark.metrics.source.JvmSource
driver.source.jvm.class=org.apache.spark.metrics.source.JvmSource
executor.source.jvm.class=org.apache.spark.metrics.source.JvmSource

# Streaming Metrics
# Ensuring Structure Streaming metrics are exposed
spark.sql.streaming.metricsEnabled=true
